<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全財産ダッシュボード</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --asset-color: #10b981;
      --expected-color: #3b82f6;
      --loan-color: #ef4444;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
    }
    .header {
      background: var(--primary);
      color: #fff;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 16px;
    }
    .header h1 { margin: 0; font-size: 1.25rem; }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .card-title {
      font-weight: bold;
      margin-bottom: 12px;
      font-size: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-reload {
      background: #f1f5f9;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .current-date {
      font-size: 0.8rem;
      color: #64748b;
      font-weight: normal;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .summary-item {
      background: #f1f5f9;
      padding: 12px 8px;
      border-radius: 8px;
      text-align: center;
    }
    .summary-label { font-size: 0.75rem; color: #64748b; font-weight: bold; }
    .summary-value { font-size: 0.95rem; font-weight: bold; margin-top: 6px; }

    /* グラフ領域 */
    .chart-container {
      position: relative;
      height: 300px;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>全財産ダッシュボード</h1>
  </div>

  <!-- 当月の最新状況カード -->
  <div class="card">
    <div class="card-title">
      <div>
        <span>💰 現在の状況</span>
        <span class="current-date" id="targetMonth">(--)</span>
      </div>
      <button class="btn-reload" onclick="fetchSheetData()">🔄 更新</button>
    </div>
    <div class="summary-grid">
      <div class="summary-item">
        <div class="summary-label">資産</div>
        <div class="summary-value" id="assetVal" style="color: var(--asset-color);">--</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">想定資産</div>
        <div class="summary-value" id="expectedVal" style="color: var(--expected-color);">--</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">残ローン</div>
        <div class="summary-value" id="loanVal" style="color: var(--loan-color);">--</div>
      </div>
    </div>
  </div>

  <!-- 全財産グラフ -->
  <div class="card">
    <div class="card-title">📈 資産・ローン推移グラフ</div>
    <div class="chart-container">
      <canvas id="assetChart"></canvas>
    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyBsxsld_XVrxfKKN7uSbFbEDi6csd1hx-J8eOZf5u0C5oSIWbEud8UW5TuuPcxnM50/exec";

    let myChart = null;

    window.onload = function() {
      fetchSheetData();
    };

    function fetchSheetData() {
      fetch(GAS_API_URL)
        .then(response => response.json())
        .then(data => {
          render(data);
        })
        .catch(error => {
          console.error('Error:', error);
        });
    }

    // 日付整形 (YYYY/MM 形式)
    function formatDate(dStr) {
      if (!dStr) return '';
      const d = new Date(dStr);
      if (isNaN(d.getTime())) return String(dStr).substring(0, 7);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      return `${year}/${month}`;
    }

    // 金額整形
    function formatMoney(val) {
      if (val === null || val === undefined || val === '' || isNaN(Number(val))) return '設定なし';
      return `¥${Number(val).toLocaleString()}`;
    }

    function render(data) {
      if (!data || data.length === 0) return;

      // 日付順にソート
      data.sort((a, b) => new Date(a.date) - new Date(b.date));

      // 今月（2026/09）以前の中で最新のデータを取得して「現在の状況」に表示
      const today = new Date();
      const currentYM = `${today.getFullYear()}/${String(today.getMonth() + 1).padStart(2, '0')}`;
      
      const pastOrCurrentData = data.filter(d => formatDate(d.date) <= currentYM);
      const currentData = pastOrCurrentData.length > 0 
        ? pastOrCurrentData[pastOrCurrentData.length - 1] 
        : data[0];

      // カード表示を更新
      document.getElementById('targetMonth').innerText = `(${formatDate(currentData.date)} 時点)`;
      document.getElementById('assetVal').innerText = formatMoney(currentData.asset);
      document.getElementById('expectedVal').innerText = formatMoney(currentData.expected);
      document.getElementById('loanVal').innerText = formatMoney(currentData.loan);

      // グラフ描画
      renderChart(data);
    }

    function renderChart(data) {
      const ctx = document.getElementById('assetChart').getContext('2d');

      const labels = data.map(d => formatDate(d.date));
      
      // 未入力（空欄・null）のものは null のまま渡し、線を描画しない設定（spanGaps: false）
      const parseValue = (v) => (v === null || v === undefined || v === '' || isNaN(Number(v))) ? null : Number(v);

      const assetData = data.map(d => parseValue(d.asset));
      const expectedData = data.map(d => parseValue(d.expected));
      const loanData = data.map(d => parseValue(d.loan));

      if (myChart) myChart.destroy();

      myChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: '資産',
              data: assetData,
              borderColor: '#10b981',
              backgroundColor: '#10b981',
              borderWidth: 2,
              pointRadius: 4,
              spanGaps: false // データが無い部分は線を結ばない
            },
            {
              label: '想定資産',
              data: expectedData,
              borderColor: '#3b82f6',
              backgroundColor: '#3b82f6',
              borderWidth: 2,
              pointRadius: 4,
              spanGaps: false
            },
            {
              label: '残ローン',
              data: loanData,
              borderColor: '#ef4444',
              backgroundColor: '#ef4444',
              borderWidth: 2,
              pointRadius: 4,
              spanGaps: false
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom' }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                callback: function(value) {
                  return '¥' + (value / 10000).toLocaleString() + '万';
                }
              }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
